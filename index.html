<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 헤더 영역 -->
        <header>
            <h1>Medicine Helper</h1>
            <div id="header-user-area">
                <button id="login-btn" class="header-btn">로그인</button>
                <span id="welcome-msg" class="hidden"></span>
                <button id="profile-btn" class="header-btn hidden">프로필</button>
                <button id="logout-btn" class="header-btn hidden" style="background:#ff4757; border:none;">로그아웃</button>
            </div>
        </header>

        <main>
            <!-- 약 검색 및 카메라 스캔 섹션 -->
            <section class="search-section">
                <input type="text" id="search-input" placeholder="약 이름을 입력하거나 스캔하세요">
                <button id="camera-btn">📷 카메라로 약 스캔하기</button>
                <button id="search-btn" class="btn-primary">검색</button>
            </section>

            <!-- 검색 결과 출력 영역 -->
            <div id="search-result-area" class="hidden" style="margin: 0 15px;"></div>

            <!-- 메인 메뉴 섹션 -->
            <section class="menu-section">
                <button id="menu-recommend">🩺 내 증상 기록 및 맞춤 추천</button>
                <button id="menu-cart">💊 나의 복약 리스트 (장바구니)</button>
                <button id="menu-alarm">⏰ 이메일 복약 알림 설정</button>
            </section>

            <!-- 복약 리스트 출력 영역 -->
            <div id="cart-display-area" class="hidden" style="margin: 15px; background: white; padding: 20px; border-radius: 12px; border: 2px solid #007bff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <h3 style="margin-top: 0; color: #007bff; border-bottom: 2px solid #f4f7f9; padding-bottom: 10px;">🛒 나의 복약 리스트</h3>
                <ul id="cart-list" style="list-style: none; padding: 0; margin: 0;"></ul>
            </div>

            <!-- 증상 기록 및 추천 영역 (체크박스 + 타이핑 추가) -->
            <div id="recommend-display-area" class="hidden" style="margin: 15px; background: white; padding: 20px; border-radius: 12px; border: 2px solid #2ecc71; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <h3 style="margin-top: 0; color: #2ecc71;">🩺 내 증상 기록 및 추천</h3>
                <p style="font-size: 14px; color: #666;">증상을 선택하거나 직접 입력하세요.</p>
                
                <!-- 체크박스 영역 -->
                <div id="symptom-options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0;">
                    <label><input type="checkbox" value="두통"> 두통</label>
                    <label><input type="checkbox" value="치통"> 치통</label>
                    <label><input type="checkbox" value="근육통"> 근육통</label>
                    <label><input type="checkbox" value="발열"> 발열</label>
                    <label><input type="checkbox" value="콧물"> 콧물</label>
                    <label><input type="checkbox" value="기침"> 기침</label>
                </div>

                <!-- 타이핑 입력 영역 추가 -->
                <div style="margin-bottom: 15px;">
                    <input type="text" id="symptom-custom-input" placeholder="기타 증상을 직접 입력 (예: 소화불량)" style="border: 1px solid #2ecc71; margin-bottom: 5px;">
                    <p style="font-size: 11px; color: #888;">* 여러 증상은 콤마(,)로 구분해서 적어주세요.</p>
                </div>

                <button id="get-recommendation-btn" class="btn-primary" style="background-color: #2ecc71;">추천 약품 보기</button>
                <div id="recommend-result" class="hidden" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc;"></div>
            </div>
        </main>

        <!-- 로그인/회원가입 모달 -->
        <div id="auth-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" id="close-modal">&times;</span>
                <h2 id="modal-title">로그인</h2>
                <div style="margin-top: 20px;">
                    <input type="text" id="username-input" placeholder="아이디를 입력하세요">
                    <input type="email" id="email-input" class="hidden" placeholder="알림 받을 이메일 (예: user@mail.com)">
                    <input type="password" id="password-input" placeholder="비밀번호">
                    <button id="submit-auth-btn" class="btn-primary">접속하기</button>
                    <p id="toggle-auth-mode">계정이 없으신가요? <b>회원가입</b></p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
